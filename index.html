<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control Room — Transcribe Live</title>
<meta name="description" content="Real-time transcription and ES/EN translation at scale for conferences." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <line x1="12" y1="19" x2="12" y2="22" />
      </svg>
      <span>Transcribe&nbsp;Live</span>
    </div>
    <span class="badge" id="engine-badge"><span class="dot"></span><span id="engine-text">connecting</span></span>
    <span class="badge badge--idle" id="capacity-badge">—</span>
    <div class="spacer"></div>
    <span class="badge" id="link-status"><span class="dot"></span><span id="link-text">offline</span></span>
  </header>

  <section class="stats" aria-label="Event totals">
    <div class="stat"><div class="stat__label">Live tracks</div><div class="stat__value" id="s-live">0</div></div>
    <div class="stat"><div class="stat__label">Words captioned</div><div class="stat__value" id="s-words">0</div></div>
    <div class="stat"><div class="stat__label">Caption latency p50</div><div class="stat__value" id="s-p50">0<span class="stat__unit">ms</span></div></div>
    <div class="stat"><div class="stat__label">Caption latency p95</div><div class="stat__value" id="s-p95">0<span class="stat__unit">ms</span></div></div>
    <div class="stat"><div class="stat__label">Spend so far</div><div class="stat__value" id="s-cost">$0.00</div></div>
  </section>

  <section class="panel">
    <h2 class="panel__title">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="16" /><line x1="8" y1="12" x2="16" y2="12" />
      </svg>
      Start a track
    </h2>
    <form class="form-grid" id="create-form">
      <div class="field">
        <label for="f-title">Track name</label>
        <input id="f-title" name="title" placeholder="Track A — Keynote" required />
      </div>
      <div class="field">
        <label for="f-source">Spoken language</label>
        <select id="f-source" name="sourceLanguage">
          <option value="auto">Auto-detect</option>
          <option value="es" selected>Spanish</option>
          <option value="en">English</option>
          <option value="pt">Portuguese</option>
        </select>
      </div>
      <div class="field">
        <label for="f-targets">Translate into</label>
        <select id="f-targets" name="targetLanguages">
          <option value="en" selected>English</option>
          <option value="es">Spanish</option>
          <option value="pt">Portuguese</option>
          <option value="en,pt">English + Portuguese</option>
          <option value="es,pt">Spanish + Portuguese</option>
        </select>
      </div>
      <div class="field">
        <label for="f-glossary">Glossary</label>
        <select id="f-glossary" name="glossaryId"></select>
      </div>
      <button class="btn btn--primary" type="submit" id="create-btn">Start track</button>
    </form>
  </section>

  <h2 class="panel__title" style="margin-bottom:12px">Live tracks</h2>
  <div class="grid" id="sessions"></div>
  <div class="empty-state" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M3 18v-6a9 9 0 0 1 18 0v6" /><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" />
    </svg>
    <p>No tracks running. Start one above, or replay a recorded talk with<br /><code class="mono">npm run replay</code> in <code class="mono">core-api</code>.</p>
  </div>
</div>
<script type="module" src="assets/js/control-room.js"></script>
</body>
</html>
