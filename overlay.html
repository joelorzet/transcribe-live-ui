<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subtitle Overlay — Transcribe Live</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --accent: #22c55e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 6vw 6vh;
  }
  body.chroma { background: #00b140; }
  .stack { width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
  .cue {
    display: inline-block; max-width: 100%;
    padding: 12px 26px; border-radius: 10px;
    background: rgba(8, 12, 22, 0.82);
    color: #fff; font-size: clamp(22px, 3.4vw, 46px); font-weight: 500; line-height: 1.28;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
    overflow-wrap: anywhere;
  }
  .cue--translated { color: var(--accent); font-weight: 700; }
  .cue:empty { display: none; }
  .offline { position: fixed; top: 12px; left: 12px; padding: 5px 11px; border-radius: 6px; background: rgba(239,68,68,.9); color: #fff; font-size: 13px; font-family: 'Roboto', sans-serif; }
  .offline[hidden] { display: none; }
</style>
</head>
<body>
<div class="offline" id="offline" hidden>subtitles disconnected</div>
<div class="stack">
  <div class="cue" id="original"></div>
  <div class="cue cue--translated" id="translated"></div>
</div>
<script type="module" src="assets/js/overlay.js"></script>
</body>
</html>
